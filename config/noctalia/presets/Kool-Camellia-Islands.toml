[accessibility]
ui_scale = 1.20

[bar.default]
background_opacity = 0.0
start = [ "group:island_left", "spacer_1", "active_window" ]
center = [ "group:island_center" ]
end = [ "media", "spacer_1", "group:island_right" ]
margin_edge = 8
margin_ends = 14
scale = 1.05
thickness = 34

    [[bar.default.capsule_group]]
    id = "island_left"
    members = [ "launcher", "workspaces" ]
    fill = "surface"
    border = "secondary"
    border_width = 1.0
    opacity = 0.92
    padding = 6.0

    [[bar.default.capsule_group]]
    id = "island_center"
    members = [ "clock" ]
    fill = "surface"
    border = "secondary"
    border_width = 1.0
    opacity = 0.92
    padding = 8.0

    [[bar.default.capsule_group]]
    id = "island_right"
    members = [ "temp", "sysmon_2", "sysmon_3", "volume", "network", "notifications", "session" ]
    fill = "surface"
    border = "secondary"
    border_width = 1.0
    opacity = 0.92
    padding = 6.0

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
color = "secondary"
format = "{:%H:%M • %a}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "secondary"

[widget.spacer_1]
type = "spacer"

[widget.temp]
color = "secondary"
show_value = false

[widget.sysmon_2]
color = "secondary"
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
color = "secondary"
glyph = "cpu-2"
show_value = false
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = false

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.4
capsule = false
change_color_on_hover = false
empty_color = "surface_variant"
focused_color = "primary"
inactive_pill_size = 0.85
occupied_color = "secondary"
pill_scale = 0.80
show_labels = false

[wallpaper]
directory = "/home/viniciusphdu/dotfiles/wallpapers"
