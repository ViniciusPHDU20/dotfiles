[accessibility]
ui_scale = 1.20

[bar.default]
start = [ "launcher", "spacer_1", "workspaces", "spacer_1", "active_window" ]
center = [ "clock" ]
end = [ "media", "spacer_1", "group:g1", "tray", "notifications", "network", "volume", "session" ]
concave_edge_corners = false
margin_edge = 8
margin_ends = 16
radius_top_left = 20
radius_top_right = 20
radius_bottom_left = 20
radius_bottom_right = 20
scale = 1.05
thickness = 38

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 0.95
    padding = 8.0

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "community"
community_palette = "Catppuccin"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
color = "secondary"
format = "{:%A, %H:%M}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "secondary"

[widget.spacer_1]
type = "spacer"

[widget.temp]
color = "secondary"
show_value = false

[widget.sysmon_2]
color = "secondary"
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
color = "secondary"
glyph = "cpu-2"
show_value = false
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.0
capsule = true
capsule_fill = "on_primary"
change_color_on_hover = false
empty_color = "surface_variant"
focused_color = "primary"
inactive_pill_size = 1.2
occupied_color = "secondary"
pill_scale = 1.0
show_labels = true

[wallpaper]
directory = "/home/viniciusphdu/dotfiles/wallpapers"
